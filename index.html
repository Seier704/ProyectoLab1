    <style>
        .project-card {
            background: #F7F7F7;

            font-family: system-ui, sans-serif;

            margin: 12px auto;

        }
        .card-title {
            font-family: 'Poppins', sans-serif;
            color: #1B3A4B;

            margin-top: 0;
        }
        .card-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            background: #E0E0E0;
            display: block;
            margin: 12px 0;
        }
        .card-description {
            color: #222222;
            font-family: system-ui, sans-serif;

        }
        .card-tech-list {
            list-style: none;
            padding: 0;
        }
        .card-tech-list li {
            display: inline-block;
            margin-right: 8px;
            color: #F2A541;
