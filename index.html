<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        .project-card {
            background: #F7F7F7;
            color: #222222;
            font-family: system-ui, sans-serif;
            border-radius: 8px;
            padding: 16px;
            max-width: 320px;
            margin: 12px auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .card-title {
            font-family: 'Poppins', sans-serif;
            color: #1B3A4B;
            text-align: center;
        }
        .card-description {
            color: #222222;
            font-family: system-ui, sans-serif;
            line-height: 1.4;
        }
        .card-tech-list li {
            display: inline-block;
            margin-right: 8px;
            color: #F2A541;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="project-card" id="matias">
      <h2 class="card-title">Matías Olivares</h2>
      <p class="card-description">Estudiante de Ingeniería Civil en Computación e Informática. </p>
      <ul class="card-tech-list">
        <li>[Tecnología 1]</li>
        <li>[Tecnología 2]</li>
        <li>[Tecnología 3]</li>
      </ul>
    </div>
</body>
</html>
